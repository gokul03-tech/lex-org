version: "3.9"

services:
  # ── FalkorDB Knowledge Graph ──────────────────────────────
  falkordb:
    image: falkordb/falkordb:latest
    container_name: lexorch-falkordb
    ports:
      - "6380:6379"   # Redis protocol
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Qdrant Vector Database ─────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: lexorch-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped


  # ── Redis (Celery Broker) ──────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: lexorch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Backend (FastAPI) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lexorch-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_PASSWORD=
      - FALKORDB_GRAPH_NAME=lexorch
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - DATABASE_URL=sqlite+aiosqlite:///./data/lexorch.db
      - LLM_BACKEND=mock
      - SANDBOX_BACKEND=process
      - LOG_FORMAT=json
    volumes:
      - ./data:/app/data
      - ./datasets:/app/datasets:ro
      - ./logs:/app/logs
      - ./outputs:/app/outputs
      - ./configs:/app/configs:ro
      # Model volumes (uncomment when models are available)
      # - /path/to/models:/app/models:ro
    depends_on:
      falkordb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Worker ──────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lexorch-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      - APP_ENV=production
      - DEBUG=false
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_PASSWORD=
      - FALKORDB_GRAPH_NAME=lexorch
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - DATABASE_URL=sqlite+aiosqlite:///./data/lexorch.db
      - LLM_BACKEND=mock
      - SANDBOX_BACKEND=process
      - LOG_FORMAT=json
    volumes:
      - ./data:/app/data
      - ./datasets:/app/datasets:ro
      - ./logs:/app/logs
      - ./outputs:/app/outputs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (Nginx + Vite Build) ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lexorch-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  falkordb_data:
  qdrant_data:
  redis_data:
