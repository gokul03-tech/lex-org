[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexorch-kg"
version = "1.0.0"
description = "LexOrch-KG: Trust-Aware Multi-Agent Legal Advisory Framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "LexOrch-KG Team"}
]
keywords = [
    "legal-ai", "knowledge-graph", "rag", "langgraph", "multi-agent",
    "explainable-ai", "neo4j", "llm", "indian-law"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Async tasks
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    # HTTP client
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    # Document processing
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "paddleocr>=2.8.0",
    "Pillow>=10.3.0",
    # NLP & Text
    "spacy>=3.7.0",
    "tiktoken>=0.7.0",
    "unstructured>=0.14.0",
    # AI / ML
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langgraph>=0.1.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.42.0",
    "torch>=2.3.0",
    # Vector DB
    "qdrant-client>=1.10.0",
    # Knowledge Graph
    "neo4j>=5.22.0",
    # RAG
    "rank-bm25>=0.2.2",
    # Sandbox
    "docker>=7.0.0",
    # Report generation
    "weasyprint>=62.0",
    "jinja2>=3.1.0",
    # Logging
    "loguru>=0.7.0",
    # Monitoring
    "psutil>=6.0.0",
    # GSMS-B / GovIntel dataset loading
    "datasets>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
llama-cpp = [
    "llama-cpp-python>=0.2.0",
]
gpu = [
    "vllm>=0.5.0",
    "bitsandbytes>=0.43.0",
    "peft>=0.11.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
